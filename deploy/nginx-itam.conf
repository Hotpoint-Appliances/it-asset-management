# nginx (Windows) site config for the IT Asset Manager (docs/deployment.md).
# Include it from the `http { }` block of conf/nginx.conf:   include  C:/nginx/conf/itam.conf;
# Replace itam.hotpoint.example and the certificate paths. nginx on Windows wants forward slashes.
#
# Base path: the locations below assume the app is built with NEXT_PUBLIC_BASE_PATH=/itam. Use
# the same value here (every "/itam/" prefix), or drop the prefix if the app is served at the
# root. proxy_pass has no URI part on purpose: the prefix is passed through, and the app
# expects it.

# Login brute-force protection, shared by every PM2 worker (an in-app counter would be
# per-worker). 5 attempts/minute per client IP, with a burst of 5 for typos.
limit_req_zone $binary_remote_addr zone=itam_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=itam_acknowledge:10m rate=20r/m;

upstream itam_app {
    server 127.0.0.1:3000;   # the port in deploy/ecosystem.config.js
    keepalive 16;
}

server {
    listen 80;
    server_name itam.hotpoint.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name itam.hotpoint.example;

    # Company certificate: the full chain (server cert first, then intermediates) and its key.
    # Lock the key file's ACL down to the account nginx runs as plus Administrators.
    ssl_certificate      C:/nginx/certs/itam-fullchain.pem;
    ssl_certificate_key  C:/nginx/certs/itam.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:SSL:10m;

    # Asset images are capped at 5 MB and attachments at 10 MB by the app
    # (lib/files/upload.ts); nginx's 1 MB default would reject them with 413.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Report exports are built in memory before they're sent; give them time.
    proxy_read_timeout 120s;

    location = /itam/api/auth/login {
        limit_req zone=itam_login burst=5 nodelay;
        limit_req_status 429;      # LoginForm shows "Too many sign-in attempts" for a 429
        proxy_pass http://itam_app;
    }

    # Change password re-checks the current password, so it shares the login zone (and budget).
    location = /itam/api/auth/password {
        limit_req zone=itam_login burst=5 nodelay;
        limit_req_status 429;      # ChangePasswordDialog shows "Too many attempts" for a 429
        proxy_pass http://itam_app;
    }

    # Forgotten-password requests send email and resets take a token, so both share the login
    # zone too: it caps inbox flooding and token guessing alongside password guessing.
    location = /itam/api/auth/forgot-password {
        limit_req zone=itam_login burst=5 nodelay;
        limit_req_status 429;      # ForgotPasswordForm shows "Too many requests" for a 429
        proxy_pass http://itam_app;
    }

    location = /itam/api/auth/reset-password {
        limit_req zone=itam_login burst=5 nodelay;
        limit_req_status 429;      # ResetPasswordForm shows "Too many attempts" for a 429
        proxy_pass http://itam_app;
    }

    # Equipment issue form links need no sign-in, so this caps token guessing and PDF generation.
    location /itam/api/acknowledge {
        limit_req zone=itam_acknowledge burst=10 nodelay;
        limit_req_status 429;      # AcknowledgeForm shows "Too many attempts" for a 429
        proxy_pass http://itam_app;
    }

    # The cron endpoint is meant for the scheduled script on this host (via 127.0.0.1), never
    # from outside. It's already secret-protected; this closes it to the network as well.
    location /itam/api/cron/ {
        return 404;
    }

    # The dashboard lives at /itam itself (no trailing slash), which "location /itam/" doesn't match.
    location = /itam {
        proxy_pass http://itam_app;
    }

    location /itam/ {
        proxy_pass http://itam_app;
    }

    # The bare host goes to the app. Drop this if something else is served at the root.
    location = / {
        return 302 /itam;
    }
}
